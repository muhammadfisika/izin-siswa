<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>Sistem Izin Siswa</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginPage" class="page active">

  <div class="login-container">

    <div class="login-card">

      <div class="login-logo">
        🏫
      </div>

      <h1>Sistem Izin Siswa</h1>

      <p class="login-subtitle">
        Izin Masuk / Keluar Sekolah
      </p>

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Masukkan username"
          autocomplete="username"
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
        >

      </div>

      <button
        type="button"
        class="btn btn-primary btn-full"
        onclick="login()"
      >
        MASUK
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </div>

</section>


<!-- =====================================================
     DASHBOARD WALI KELAS
===================================================== -->

<section
  id="waliPage"
  class="page"
>

  <header class="topbar">

    <div>
      <h2>Dashboard Wali Kelas</h2>

      <p id="waliInfo">
        -
      </p>
    </div>

    <button
      class="btn btn-danger"
      onclick="logout()"
    >
      Keluar
    </button>

  </header>


  <main class="container">

    <div class="card">

      <h3>Pengajuan Izin Siswa</h3>

      <div class="form-group">

        <label>
          Cari Nama Siswa
        </label>

        <input
          type="text"
          id="cariSiswaInput"
          placeholder="Ketik nama siswa..."
          oninput="cariSiswa()"
        >

      </div>

      <div
        id="hasilPencarianSiswa"
        class="student-list"
      ></div>

      <div
        id="siswaTerpilih"
        class="selected-student hidden"
      ></div>

    </div>


    <div
      id="formIzin"
      class="card hidden"
    >

      <h3>Form Izin</h3>

      <div class="form-group">

        <label>
          Tanggal
        </label>

        <input
          type="date"
          id="tanggalIzin"
        >

      </div>


      <div class="form-group">

        <label>
          Jenis Izin
        </label>

        <div class="radio-group">

          <label class="radio-option">

            <input
              type="radio"
              name="jenisIzin"
              value="KELUAR"
              onchange="ubahJenisIzin()"
            >

            <span>KELUAR</span>

          </label>


          <label class="radio-option">

            <input
              type="radio"
              name="jenisIzin"
              value="MASUK"
              onchange="ubahJenisIzin()"
            >

            <span>MASUK</span>

          </label>

        </div>

      </div>


      <div class="form-group">

        <label>
          Alasan Izin
        </label>

        <textarea
          id="alasanIzin"
          rows="3"
          placeholder="Masukkan alasan izin..."
        ></textarea>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label>
            Waktu Keluar
          </label>

          <input
            type="time"
            id="waktuKeluar"
          >

        </div>


        <div class="form-group">

          <label>
            Waktu Masuk
          </label>

          <input
            type="time"
            id="waktuMasuk"
          >

        </div>

      </div>


      <button
        type="button"
        class="btn btn-success btn-full"
        onclick="simpanIzin()"
      >
        SIMPAN IZIN
      </button>

    </div>

  </main>

</section>


<!-- =====================================================
     DASHBOARD WAKASEK
===================================================== -->

<section
  id="wakasekPage"
  class="page"
>

  <header class="topbar">

    <div>

      <h2>
        Dashboard Wakasek
      </h2>

      <p id="wakasekInfo">
        -
      </p>

    </div>

    <button
      class="btn btn-danger"
      onclick="logout()"
    >
      Keluar
    </button>

  </header>


  <main class="container">

    <div class="stats-grid">

      <div class="stat-card">

        <div class="stat-number" id="statMenunggu">
          0
        </div>

        <div>
          Menunggu
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-number" id="statDisetujui">
          0
        </div>

        <div>
          Disetujui
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-number" id="statTotal">
          0
        </div>

        <div>
          Total Hari Ini
        </div>

      </div>

    </div>


    <div class="filter-group">

      <button
        class="filter-btn active"
        onclick="filterWakasek('SEMUA')"
      >
        Semua
      </button>

      <button
        class="filter-btn"
        onclick="filterWakasek('MENUNGGU')"
      >
        Menunggu
      </button>

      <button
        class="filter-btn"
        onclick="filterWakasek('DISETUJUI')"
      >
        Disetujui
      </button>

    </div>


    <div id="daftarIzinWakasek"></div>

  </main>

</section>


<!-- =====================================================
     MODAL DETAIL
===================================================== -->

<div
  id="detailModal"
  class="modal hidden"
>

  <div class="modal-content">

    <div class="modal-header">

      <h3>
        Detail Izin
      </h3>

      <button
        class="modal-close"
        onclick="tutupDetail()"
      >
        ×
      </button>

    </div>

    <div
      id="detailIsi"
      class="modal-body"
    ></div>

  </div>

</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div
  id="loading"
  class="loading hidden"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <p>
      Memproses...
    </p>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
